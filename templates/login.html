<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BDC Dashboard Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#eef2f7;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Segoe UI, sans-serif;
        }

        .login-card{
            width:420px;
            padding:40px;
            background:#2d2f34;
            border-radius:15px;
            box-shadow:0 10px 30px rgba(0,0,0,.25);
        }

        .btn-primary{
            background:#0b1f3a;
            border:none;
        }

        .btn-primary:hover{
            background:#16345e;
        }

    </style>

</head>

<body>

<div class="login-card">

    <div class="text-center mb-4">

        <img src="https://www.drivechoice.com/wp-content/themes/DealerInspireDealerTheme/images/logo-footer.png"
             alt="Honda of Cleveland Heights"
             class="img-fluid mb-3"
             style="max-width:320px;">

        <h4 class="text-white fw-bold">
            Business Development Center
        </h4>

        <p class="text-white">
            Please sign in to continue
        </p>

    </div>

    {% if error %}
    <div class="alert alert-danger">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login">

        <div class="mb-3">

            <label class="form-label text-white">
                Username
            </label>

            <input
                type="text"
                name="username"
                class="form-control"
                placeholder="Enter your username"
                required>

        </div>

        <div class="mb-4">

            <label class="form-label text-white">
                Password
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Enter your password"
                required>

        </div>

        <button
            type="submit"
            class="btn btn-primary w-100">

            Login

        </button>

    </form>

</div>

</body>

</html>
