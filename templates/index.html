<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDC Dashboard Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#eef2f7;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Segoe UI, sans-serif;
        }

        .login-card{
            width:420px;
            padding:40px;
            border-radius:15px;
            box-shadow:0 10px 30px rgba(0,0,0,.15);
            background:white;
        }

        h2{
            color:#0b1f3a;
            font-weight:bold;
        }

        .btn-primary{
            background:#0b1f3a;
            border:none;
        }

        .btn-primary:hover{
            background:#16345e;
        }

    </style>

</head>

<body>

<div class="login-card">

    <div class="text-center mb-4">

        <h2>🚗 Honda of Cleveland Heights</h2>

        <h5 class="text-primary">
            Business Development Center
        </h5>

        <p class="text-muted">
            Please sign in to continue
        </p>

    </div>

    <form>

        <div class="mb-3">

            <label class="form-label">Username</label>

            <input
                    type="text"
                    class="form-control">

        </div>

        <div class="mb-4">

            <label class="form-label">Password</label>

            <input
                    type="password"
                    class="form-control">

        </div>

        <button
                class="btn btn-primary w-100">

            Login

        </button>

    </form>

</div>

</body>
</html>
